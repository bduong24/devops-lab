name: App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab:ci .

      - name: Start container
        run: |
          docker run -d --name devops-lab \
            -p 127.0.0.1:3000:3000 devops-lab:ci

      - name: Verify endpoints
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3000/health
          curl --fail http://localhost:3000/
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:3000/missing)
          test "$status" = "404"

      - name: Show container logs
        if: always()
        run: docker logs devops-lab || true

      - name: Remove container
        if: always()
        run: docker rm -f devops-lab || true
