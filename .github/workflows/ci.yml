name: App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab:ci .

      - name: Start container
        run: |
          docker run -d --name devops-lab \
            -p 127.0.0.1:3000:3000 devops-lab:ci

      - name: Verify endpoints
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3000/health; then
              ready=true
              break
            fi
            echo "Waiting for app: attempt $attempt"
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "App did not become ready"
            exit 1
          fi

          curl --fail http://127.0.0.1:3000/
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/missing)
          test "$status" = "404"

      - name: Show container logs
        if: always()
        run: docker logs devops-lab || true

      - name: Remove container
        if: always()
        run: docker rm -f devops-lab || true
